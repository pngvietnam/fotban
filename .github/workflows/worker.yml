# The freshness worker for the hosted site: one pass every five minutes (news, scores, standings, match details,
# league leaders, fan threads, highlights, player photos) written straight into the production database.
# Needs these repository secrets: DATABASE_URL (the pooler session-mode URL), FOOTBALL_DATA_API_KEY,
# HIGHLIGHTLY_API_KEY, WIKIMEDIA_USER_AGENT and, optionally, YOUTUBE_API_KEY.
name: Fotban worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: fotban-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/news-worker.ts
        env:
          WORKER_ONCE: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APP_TIMEZONE: Asia/Ho_Chi_Minh
          LOG_LEVEL: info
