# Local development only. These deliberately public development credentials
# must never be reused for staging or production.
name: football-morning-brief

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: football_morning
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
